name: collective_rewiring
channels:
  - conda-forge
  - defaults
dependencies:
  # Core packages available via conda
  - python=3.11  # Using 3.11 for better compatibility
  - numpy=1.24.2
  - pandas
  - scipy
  - sympy
  - matplotlib
  - seaborn
  - networkx
  - rustworkx
  - setuptools
  - wheel
  - joblib
  # Packages that need to be installed via pip
  - pip
  - pip:
    - netin==1.0.7
    - node2vec
    - leidenalg
    - python-igraph
    - powerlaw==1.5
    # Pre_processing/empirical_network_analysis.py only
    - python-louvain
    - ipython
